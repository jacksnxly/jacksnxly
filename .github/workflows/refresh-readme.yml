# Rebuilds README.md and assets/ once a day: GitHub numbers (tools/fetch_stats.py) and the latest posts (jacksonly.xyz RSS).
# The stats need a token that can read private repos, stored as the README_STATS_TOKEN secret. Without it the
# committed numbers in tools/stats.json are kept and only the post list refreshes.
name: Refresh README

on:
  schedule:
    - cron: "17 5 * * *" # daily, off the top of the hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-readme
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: pip install -r tools/requirements.txt

      - name: Fetch GitHub numbers
        env:
          GH_TOKEN: ${{ secrets.README_STATS_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            python tools/fetch_stats.py tools/stats.json
          else
            echo "README_STATS_TOKEN is not set; keeping the committed numbers."
          fi

      - name: Fetch the latest posts
        run: curl -fsSL --retry 3 https://jacksonly.xyz/rss.xml -o "$RUNNER_TEMP/rss.xml"

      - name: Build README and SVGs
        run: python tools/build.py "$RUNNER_TEMP/rss.xml"

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets tools/stats.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: refresh README numbers and posts"
            git push
          fi
